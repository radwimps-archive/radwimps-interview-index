# サイトを公開する
# main ブランチに変更が保存（コミット）されるたびに動きます。
#   1. プログラムのテストと、記事データ・年表の書式をチェック（エラーがあればここで止まり、サイトは前の状態のまま）
#   2. 問題がなければ、GitHub Pages にサイトを公開
# 手動で動かすとき：「Actions」タブ → 「サイトを公開する」 → 「Run workflow」

name: サイトを公開する

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: ファイルを取り出す
        uses: actions/checkout@v7

      - name: Node.js を準備する
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: プログラムのテストをする（tests フォルダ）
        run: node --test

      - name: 記事データと年表の書式をチェックする
        run: node tools/validate.mjs

      - name: 公開するファイルをまとめる
        run: |
          mkdir _site
          cp -r index.html maker.html history.html songs.html members.html 404.html assets data _site/

      - name: 古い表示が残らないように、読み込むファイルに版の番号を付ける
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -E "s#(assets/[a-z]+\.(js|css))\"#\1?v=${V}\"#g" _site/index.html _site/maker.html _site/history.html _site/members.html _site/404.html
          sed -i -E "s#(\"\./[a-z]+\.js)\"#\1?v=${V}\"#g" _site/assets/*.js

      - name: GitHub Pages の準備
        uses: actions/configure-pages@v6

      - name: ファイルをアップロードする
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: 公開する
        id: deployment
        uses: actions/deploy-pages@v5
